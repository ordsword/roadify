<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="#0d101d" stroke="#252b45" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Canvas dot grid hints -->
  <circle cx="56" cy="56" r="3" fill="#2d3557" />
  <circle cx="96" cy="56" r="3" fill="#2d3557" />
  <circle cx="136" cy="56" r="3" fill="#2d3557" />
  <circle cx="176" cy="56" r="3" fill="#2d3557" />
  
  <circle cx="56" cy="200" r="3" fill="#2d3557" />
  <circle cx="96" cy="200" r="3" fill="#2d3557" />
  <circle cx="136" cy="200" r="3" fill="#2d3557" />
  <circle cx="176" cy="200" r="3" fill="#2d3557" />

  <!-- Roadify S-curve Roadmap track -->
  <path d="M 60 160 C 100 160, 100 96, 150 96 C 180 96, 196 116, 196 140" fill="none" stroke="url(#grad1)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Milestone Cards / Nodes -->
  <!-- Node 1 (Start) -->
  <rect x="42" y="136" width="48" height="48" rx="12" fill="#131728" stroke="#10b981" stroke-width="4" />
  <polyline points="56,160 64,168 76,152" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node 2 (Middle in progress) -->
  <rect x="126" y="72" width="48" height="48" rx="12" fill="#131728" stroke="#6366f1" stroke-width="4" />
  <circle cx="150" cy="96" r="8" fill="#6366f1" />

  <!-- Node 3 (Goal / Flag) -->
  <rect x="172" y="116" width="48" height="48" rx="12" fill="#131728" stroke="#f59e0b" stroke-width="4" />
  <polygon points="188,132 204,140 188,148" fill="#f59e0b" />
  <line x1="188" y1="132" x2="188" y2="156" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
</svg>
